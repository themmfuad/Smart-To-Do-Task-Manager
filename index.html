<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do & Task Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 22px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .search-container {
            margin-bottom: 12px;
        }

        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            font-size: 14px;
        }

        .add-btn {
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
            white-space: nowrap;
        }

        .add-btn:hover {
            background-color: #27ae60;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .filters {
            display: flex;
            gap: 5px;
        }

        .filter-btn {
            background-color: #ecf0f1;
            color: #333;
            padding: 6px 10px;
            font-size: 12px;
        }

        .filter-btn.active {
            background-color: #3498db;
            color: white;
        }

        .clear-btn {
            background-color: #e74c3c;
            color: white;
            padding: 6px 10px;
            font-size: 12px;
        }

        .clear-btn:hover {
            background-color: #c0392b;
        }

        .progress-container {
            margin-bottom: 15px;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #555;
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: #2ecc71;
            transition: width 0.3s ease;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 8px;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .task-text {
            font-size: 14px;
            word-break: break-word;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background-color: transparent;
            color: #e74c3c;
            font-weight: bold;
            padding: 4px 8px;
            font-size: 14px;
        }

        .delete-btn:hover {
            color: #c0392b;
            background-color: #fadbd8;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart To-Do & Task Manager</h1>
        <p class="subtitle">Organize daily activities simple and fast</p>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search tasks here...">
        </div>

        <!-- Add Task Field -->
        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Enter new task description...">
            <button type="button" id="addBtn" class="add-btn">Add Task</button>
        </div>

        <!-- Filters & Clear Toolbar -->
        <div class="toolbar">
            <div class="filters">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="active">Active</button>
                <button type="button" class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <button type="button" id="clearBtn" class="clear-btn">Clear Completed</button>
        </div>

        <!-- Progress Indicator -->
        <div class="progress-container">
            <div class="progress-stats">
                <span id="taskStats">Total: 0 | Completed: 0</span>
                <span id="percentStats">0%</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>

        <!-- Task List Container -->
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyMsg" class="empty-msg" style="display: none;">No tasks found!</div>
    </div>

    <script>
        // Array in memory
        let tasks = [];
        let currentFilter = 'all';

        // Safe localStorage loading
        try {
            const stored = localStorage.getItem('smart_tasks_list');
            if (stored) {
                tasks = JSON.parse(stored);
            }
        } catch (e) {
            tasks = [];
        }

        // Safe localStorage saving
        function saveTasks() {
            try {
                localStorage.setItem('smart_tasks_list', JSON.stringify(tasks));
            } catch (e) {
                // Ignore storage failure if local environment blocks storage
            }
        }

        // DOM elements
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const searchInput = document.getElementById('searchInput');
        const taskList = document.getElementById('taskList');
        const emptyMsg = document.getElementById('emptyMsg');
        const clearBtn = document.getElementById('clearBtn');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const taskStats = document.getElementById('taskStats');
        const percentStats = document.getElementById('percentStats');
        const progressFill = document.getElementById('progressFill');

        // Core add task handler
        function handleAddTask() {
            const text = taskInput.value.trim();
            if (!text) return;

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false
            };

            tasks.push(newTask);
            saveTasks();

            // Clear inputs and active filter so new item shows immediately
            taskInput.value = '';
            searchInput.value = '';
            currentFilter = 'all';
            filterBtns.forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');

            renderTasks();
        }

        // Render task items
        function renderTasks() {
            taskList.innerHTML = '';
            const query = (searchInput.value || '').toLowerCase().trim();

            const filteredTasks = tasks.filter(task => {
                const matchesSearch = task.text.toLowerCase().includes(query);
                if (currentFilter === 'active') return !task.completed && matchesSearch;
                if (currentFilter === 'completed') return task.completed && matchesSearch;
                return matchesSearch;
            });

            emptyMsg.style.display = filteredTasks.length === 0 ? 'block' : 'none';

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item' + (task.completed ? ' completed' : '');

                const contentDiv = document.createElement('div');
                contentDiv.className = 'task-content';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.completed;
                checkbox.onclick = function() {
                    toggleTask(task.id);
                };

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = task.text;

                contentDiv.appendChild(checkbox);
                contentDiv.appendChild(span);

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'X';
                deleteBtn.onclick = function() {
                    deleteTask(task.id);
                };

                li.appendChild(contentDiv);
                li.appendChild(deleteBtn);

                taskList.appendChild(li);
            });

            updateProgress();
        }

        // Toggle task completion
        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
            renderTasks();
        }

        // Delete task item
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        // Update progress bar & counts
        function updateProgress() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            taskStats.textContent = `Total: ${total} | Completed: ${completed}`;
            percentStats.textContent = percent + '%';
            progressFill.style.width = percent + '%';
        }

        // Direct onclick assignment to avoid listener issues
        addBtn.onclick = handleAddTask;

        taskInput.onkeypress = function(e) {
            if (e.key === 'Enter') {
                handleAddTask();
            }
        };

        searchInput.oninput = renderTasks;

        clearBtn.onclick = function() {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            renderTasks();
        };

        filterBtns.forEach(btn => {
            btn.onclick = function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                renderTasks();
            };
        });

        // Run initial display
        renderTasks();
    </script>
</body>
</html>
